  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const tabs = document.querySelectorAll('.tab');
      const searchInput = document.querySelector('.search input');
      const markAllBtn = document.querySelector('.btn-outline');
      const bellBadge = document.querySelector('.bell-badge');

      await renderFocosDinamicos();
      const cards = document.querySelectorAll('.alert-card');

      let activeTab = 'todos';

      function getUnreadCount() {
        return [...cards].filter(
          c => c.dataset.unread === 'true' && !c.classList.contains('read')
        ).length;
      }

      function updateTabCounts() {
        const total = cards.length;
        const criticos = [...cards].filter(c => c.dataset.type === 'critical').length;
        const unread = getUnreadCount();
        const sistemas = [...cards].filter(c => c.dataset.type === 'system').length;

        const counts = [total, criticos, unread, sistemas];
        tabs.forEach((tab, i) => {
          const span = tab.querySelector('span');
          if (span) span.textContent = `(${counts[i]})`;
        });
      }

      function updateBadge() {
        const count = getUnreadCount();
        bellBadge.textContent = count;
        bellBadge.style.display = count > 0 ? 'flex' : 'none';
        updateTabCounts();
      }

      const CATEGORIA_POR_TOGGLE = ['foco', 'qualidade_ar', 'meteorologia', 'relatorio', 'sistema'];

      function categoriasHabilitadas() {
        const ativas = new Set();
        document.querySelectorAll('.settings-card:first-of-type .toggle-row input[type="checkbox"]').forEach((tg, i) => {
          if (tg.checked && CATEGORIA_POR_TOGGLE[i]) ativas.add(CATEGORIA_POR_TOGGLE[i]);
        });
        return ativas;
      }

      function filterCards() {
        const query = searchInput.value.toLowerCase().trim();
        const ativas = categoriasHabilitadas();

        cards.forEach(card => {
          const type = card.dataset.type;
          const categoria = card.dataset.categoria;
          const isUnread = card.dataset.unread === 'true' && !card.classList.contains('read');
          const text = card.textContent.toLowerCase();

          let tabMatch = true;
          if (activeTab === 'criticos') tabMatch = type === 'critical';
          else if (activeTab === 'naolidos') tabMatch = isUnread;
          else if (activeTab === 'sistemas') tabMatch = type === 'system';

          const searchMatch = !query || text.includes(query);
          const categoriaMatch = !categoria || ativas.has(categoria);

          card.style.display = tabMatch && searchMatch && categoriaMatch ? '' : 'none';
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          cards.forEach(c => c.classList.remove('expanded'));

          const label = tab.textContent.replace(/\s*\(.*\)/, '').trim().toLowerCase();
          if (label === 'todos') activeTab = 'todos';
          else if (label.includes('critico') || label.includes('crítico')) activeTab = 'criticos';
          else if (label.includes('lido')) activeTab = 'naolidos';
          else if (label.includes('sistema')) activeTab = 'sistemas';

          filterCards();
        });
      });

      searchInput.addEventListener('input', () => {
        cards.forEach(card => card.classList.remove('expanded'));
        filterCards();
      });

      cards.forEach(card => {
        card.addEventListener('click', () => {
          const willExpand = !card.classList.contains('expanded');
          cards.forEach(c => c.classList.remove('expanded'));
          if (willExpand) card.classList.add('expanded');

          if (!card.classList.contains('read')) {
            card.classList.add('read');
            updateBadge();
            if (activeTab === 'naolidos') {
              card.classList.remove('expanded');
              filterCards();
            }
          }
        });
      });

      document.querySelector('.alert-list').addEventListener('click', e => {
        const btn = e.target.closest('.detail-btn');
        if (!btn) return;
        e.stopPropagation();

        if (btn.classList.contains('detail-btn--ver')) {
          const a = alertasCache.get(btn.dataset.alertaId);
          if (a) abrirModalDetalhe(a);
        } else if (btn.classList.contains('detail-btn--reportar')) {
          const params = new URLSearchParams({ alerta: btn.dataset.alertaId, titulo: btn.dataset.titulo });
          window.location.href = `../reportar_ocorrencia/index.html?${params}`;
        } else if (btn.classList.contains('detail-btn--compartilhar')) {
          const titulo = btn.dataset.titulo;
          const descricao = btn.dataset.descricao;
          const url = window.location.href.split('?')[0];
          const shareData = { title: `Flamer — ${titulo}`, text: descricao, url };
          if (navigator.share) {
            navigator.share(shareData).catch(() => {});
          } else {
            navigator.clipboard.writeText(`${titulo}\n${descricao}\n${url}`).then(() => {
              btn.textContent = 'Copiado!';
              setTimeout(() => { btn.textContent = 'Compartilhar'; }, 2000);
            });
          }
        }
      });

      markAllBtn.addEventListener('click', () => {
        cards.forEach(card => card.classList.add('read'));
        updateBadge();
        if (activeTab === 'naolidos') filterCards();
      });

      const toggles = document.querySelectorAll('.toggle-row input[type="checkbox"]');
      const togglesConfig = document.querySelectorAll('.settings-card:first-of-type .toggle-row input[type="checkbox"]');
      toggles.forEach((toggle, i) => {
        const namedKey = toggle.dataset.prefKey;
        const indexKey = `flamer_toggle_${i}`;
        const key = namedKey || indexKey;
        const saved = localStorage.getItem(key);
        if (saved !== null) toggle.checked = saved === 'true';

        toggle.addEventListener('change', () => {
          localStorage.setItem(key, toggle.checked);
          if (namedKey) localStorage.setItem(namedKey, toggle.checked);
          if ([...togglesConfig].includes(toggle)) filterCards();
        });
      });

      window.addEventListener('storage', e => {
        if (!e.key || !e.key.startsWith('flamer_pref_')) return;
        toggles.forEach(toggle => {
          if (toggle.dataset.prefKey === e.key) {
            toggle.checked = e.newValue === 'true';
          }
        });
      });

      updateTabCounts();
      updateBadge();
      filterCards();
    });

    const alertasCache = new Map();

    async function renderFocosDinamicos() {
      const list = document.querySelector('.alert-list');
      if (!list) return;
      try {
        const res = await fetch('http://localhost:3001/alertas');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const alertas = await res.json();
        alertasCache.clear();
        alertas.forEach(a => alertasCache.set(String(a.id), a));
        list.innerHTML = alertas.map(alertaToCardHTML).join('');
      } catch (err) {
        console.error('Falha ao carregar alertas:', err);
        list.innerHTML = '<div style="padding:24px;color:#64748b;text-align:center">Nao foi possivel carregar alertas. Verifique se o json-server esta rodando em :3001.</div>';
      }
    }

    const COORDS_PADRAO = { lat: -19.925, lng: -43.94 };

    const CHECKLISTS = {
      foco_critical: [
        'Acione imediatamente a brigada da fazenda.',
        'Isole o perimetro afetado e mantenha pessoas a distancia segura.',
        'Comunique propriedades vizinhas no raio de 5 km.',
        'Ligue para o Corpo de Bombeiros (193) se o foco progredir.'
      ],
      foco_warning: [
        'Reforce o monitoramento do setor afetado.',
        'Prepare a brigada e equipamentos para acionamento rapido.',
        'Acompanhe a evolucao do vento e umidade nas proximas 2 horas.'
      ],
      qualidade_ar: [
        'Feche janelas e portas das areas habitadas.',
        'Suspenda atividades externas (trabalho de campo, exercicios).',
        'Pessoas com problemas respiratorios devem usar mascara N95.',
        'Verifique medidores locais periodicamente.'
      ],
      meteorologia: [
        'Suspenda queimas controladas durante a janela de risco.',
        'Reforce aceiros nas divisas mais vulneraveis.',
        'Mantenha equipe atenta a focos durante o periodo de vento forte.'
      ],
      relatorio: [
        'Acesse o relatorio na aba Relatorios.',
        'Compartilhe com a gestao e tecnicos responsaveis.'
      ],
      sistema: [
        'Nenhuma acao necessaria. Atualizacao informativa.',
        'Revise suas preferencias na aba Conta se desejar.'
      ]
    };

    const CONTATOS = [
      { nome: 'Corpo de Bombeiros', tel: '193' },
      { nome: 'Defesa Civil', tel: '199' },
      { nome: 'IBAMA (Prevfogo)', tel: '0800-61-8080' },
      { nome: 'ICMBio', tel: '0800-940-7755' }
    ];

    function gerarChecklist(a) {
      if (a.categoria === 'foco') {
        return CHECKLISTS[a.tipo === 'critical' ? 'foco_critical' : 'foco_warning'];
      }
      return CHECKLISTS[a.categoria] || ['Acompanhe a evolucao do alerta.'];
    }

    function bboxAoRedor(lat, lng, d = 0.02) {
      return `${lng - d},${lat - d},${lng + d},${lat + d}`;
    }

    function montarModalHTML(a) {
      const detalhe = a.detalhe || {};
      const dados = detalhe.dadosTecnicos || {};
      const pillCls = { critical: 'pill--critical', warning: 'pill--warning', info: 'pill--info', system: 'pill--system' }[a.tipo] || 'pill--info';
      const techItems = Object.entries(dados).map(
        ([k, v]) => `<div class="tech-item"><span>${formatarChave(k)}</span><span>${v}</span></div>`
      ).join('');
      const coords = detalhe.coords || COORDS_PADRAO;
      const bbox = bboxAoRedor(coords.lat, coords.lng);
      const mapaSrc = `https://www.openstreetmap.org/export/embed.html?bbox=${bbox}&layer=mapnik&marker=${coords.lat},${coords.lng}`;
      const checklist = gerarChecklist(a).map(p => `<li>${p}</li>`).join('');
      const contatos = CONTATOS.map(c => `<li><a href="tel:${c.tel.replace(/[^0-9]/g, '')}">${c.nome}<span>${c.tel}</span></a></li>`).join('');
      const horario = a.horario ? new Date(a.horario).toLocaleString('pt-BR') : '';
      return `
        <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="modal-titulo">
          <div class="modal-header">
            <div class="modal-header-info">
              <div id="modal-titulo" class="modal-title">${a.titulo}</div>
              <div class="modal-subtitle">${a.origem || ''} ${horario ? '· ' + horario : ''}</div>
            </div>
            <span class="pill ${pillCls}">${a.severidade}</span>
            <button type="button" class="modal-close" aria-label="Fechar">&times;</button>
          </div>
          <div>${a.descricao}</div>
          ${detalhe.localizacao ? `<div class="modal-section"><h3>Localizacao</h3><div>${detalhe.localizacao}</div></div>` : ''}
          <div class="modal-section">
            <h3>Mapa</h3>
            <iframe class="modal-map" src="${mapaSrc}" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
          </div>
          ${detalhe.acaoRecomendada ? `<div class="modal-section"><h3>Acao recomendada</h3><div>${detalhe.acaoRecomendada}</div></div>` : ''}
          ${techItems ? `<div class="modal-section"><h3>Dados tecnicos</h3><div class="detail-tech">${techItems}</div></div>` : ''}
          <div class="modal-section">
            <h3>Checklist de resposta</h3>
            <ol class="modal-checklist">${checklist}</ol>
          </div>
          <div class="modal-section">
            <h3>Contatos de emergencia</h3>
            <ul class="modal-contatos">${contatos}</ul>
          </div>
        </div>`;
    }

    function abrirModalDetalhe(a) {
      const mount = document.getElementById('modal-detalhe');
      if (!mount) return;
      mount.innerHTML = montarModalHTML(a);
      mount.hidden = false;
      document.body.style.overflow = 'hidden';
      mount.querySelector('.modal-close').addEventListener('click', fecharModal);
      mount.addEventListener('click', e => { if (e.target === mount) fecharModal(); });
      document.addEventListener('keydown', escFecha);
    }

    function fecharModal() {
      const mount = document.getElementById('modal-detalhe');
      if (!mount) return;
      mount.hidden = true;
      mount.innerHTML = '';
      document.body.style.overflow = '';
      document.removeEventListener('keydown', escFecha);
    }

    function escFecha(e) { if (e.key === 'Escape') fecharModal(); }

    function alertaToCardHTML(a) {
      const iconePorCategoria = { foco: '🔥', qualidade_ar: '🌫️', meteorologia: '🌬️', relatorio: '📄', sistema: '🧰' };
      const pillCls = { critical: 'pill--critical', warning: 'pill--warning', info: 'pill--info', system: 'pill--system' }[a.tipo] || 'pill--info';
      const cardModifier = a.tipo === 'critical' ? ' alert-card--critical' : (a.tipo === 'warning' ? ' alert-card--warning' : '');
      const icone = iconePorCategoria[a.categoria] || '🔔';
      const tempo = formatarTempo(a.horario);
      const readCls = a.lido ? ' read' : '';
      const detalhe = a.detalhe || {};
      const dadosTecnicos = detalhe.dadosTecnicos || {};
      const techItems = Object.entries(dadosTecnicos).map(
        ([k, v]) => `<div class="tech-item"><span>${formatarChave(k)}</span><span>${v}</span></div>`
      ).join('');
      return `
        <article class="alert-card${cardModifier}${readCls}" data-type="${a.tipo}" data-unread="${!a.lido}" data-categoria="${a.categoria}">
          <div class="alert-icon"><span>${icone}</span></div>
          <div class="alert-body">
            <div class="alert-title">${a.titulo}</div>
            <div class="alert-text">${a.descricao}</div>
          </div>
          <div class="alert-meta">
            <span>${tempo}</span>
            <span class="pill ${pillCls}">${a.severidade}</span>
          </div>
          <div class="alert-detail">
            ${detalhe.localizacao ? `<div class="detail-row"><strong>Localizacao:</strong> ${detalhe.localizacao}</div>` : ''}
            ${detalhe.acaoRecomendada ? `<div class="detail-row"><strong>Acao recomendada:</strong> ${detalhe.acaoRecomendada}</div>` : ''}
            ${techItems ? `<div class="detail-tech">${techItems}</div>` : ''}
            <div class="detail-actions">
              <button type="button" class="detail-btn detail-btn--ver" data-alerta-id="${a.id}">Ver detalhes</button>
              <button type="button" class="detail-btn detail-btn--reportar" data-alerta-id="${a.id}" data-titulo="${a.titulo.replace(/"/g, '&quot;')}">Reportar</button>
              <button type="button" class="detail-btn detail-btn--compartilhar" data-alerta-id="${a.id}" data-titulo="${a.titulo.replace(/"/g, '&quot;')}" data-descricao="${a.descricao.replace(/"/g, '&quot;')}">Compartilhar</button>
            </div>
          </div>
        </article>`;
    }

    function formatarTempo(iso) {
      if (!iso) return '';
      const data = new Date(iso);
      if (isNaN(data)) return iso;
      const agora = new Date();
      const diffMin = Math.round((agora - data) / 60000);
      if (diffMin < 60) return `Ha ${diffMin} min`;
      const diffH = Math.round(diffMin / 60);
      if (diffH < 24) return `Ha ${diffH} h`;
      const diffD = Math.round(diffH / 24);
      if (diffD === 1) return 'Ontem';
      if (diffD < 7) return `${diffD} dias atras`;
      return data.toLocaleDateString('pt-BR');
    }

    function formatarChave(k) {
      const mapa = { idFoco: 'ID do foco', iqa: 'IQA', dadosTecnicos: 'Dados' };
      if (mapa[k]) return mapa[k];
      return k.charAt(0).toUpperCase() + k.slice(1).replace(/([A-Z])/g, ' $1');
    }
  </script>
  <script>
    document.querySelectorAll('.glass-card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      });
    });
  </script>
  <div id="modal-detalhe" hidden></div>
</body>
</html>
