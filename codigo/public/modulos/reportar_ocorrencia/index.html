    <main class="main">
      <header class="topbar">
        <h1>Reportar Ocorrência</h1>
        <div class="topbar-actions">
          <button class="alert-bell" aria-label="Alertas" data-count="2">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
          </button>
          <div class="top-avatar">JP</div>
        </div>
      </header>

      <section class="content">
        <div class="report-container">
          <div class="card report-card">
            <div class="card-header-actions">
              <h2 id="formTitle">Detalhes da Ocorrência</h2>
              <div class="actions">
                <button class="btn-icon btn-edit" type="button" title="Editar">
                  <svg viewBox="0 0 24 24" stroke-width="1.8"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                </button>
                <button class="btn-icon btn-delete" type="button" title="Deletar">
                  <svg viewBox="0 0 24 24" stroke-width="1.8"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>
                </button>
              </div>
            </div>
            <form id="reportForm">
              <div class="form-row">
                <div class="form-group">
                  <label>Tipo de Ocorrência *</label>
                  <select name="tipo" id="tipo" required>
                    <option value="">Selecione...</option>
                    <option value="Incêndio em Mata">Incêndio em Mata</option>
                    <option value="Foco de Calor">Foco de Calor</option>
                    <option value="Queimada Controlada">Queimada Controlada</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Severidade</label>
                  <select name="severidade" id="severidade" class="select-high">
                    <option value="alta">Alta (Crítico)</option>
                    <option value="media">Média</option>
                    <option value="baixa">Baixa</option>
                  </select>
                </div>
              </div>

              <div class="form-group">
                <label>Descrição</label>
                <textarea name="descricao" id="descricao" placeholder="Descreva o local e a situação..."></textarea>
              </div>

              <label>Localização (Clique no mapa ou use GPS)</label>
              <div id="map" style="height: 300px; border-radius: 12px; margin-bottom: 12px; border: 1px solid var(--line);"></div>
              <div class="gps-box">
                <button type="button" class="btn-gps" onclick="pegarGPS()">
                  <svg viewBox="0 0 24 24" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4"/></svg>
                  Usar minha localização atual
                </button>
                <div class="coords">
                  <input type="text" name="lat" id="lat" readonly placeholder="Latitude">
                  <input type="text" name="lng" id="lng" readonly placeholder="Longitude">
                </div>
              </div>

              <div class="form-group">
                <label>Anexar Fotos</label>
                <div class="upload-zone" onclick="document.getElementById('fotoInput').click()" id="dropZone">
                  <input type="file" id="fotoInput" hidden accept="image/*" multiple>
                  <span id="uploadText">Anexar Imagens</span>
                  <div id="previewContainer" class="preview-container"></div>
                </div>
              </div>

              <button type="submit" id="btnSubmit" class="btn-submit">Enviar Relatório</button>
            </form>
          </div>

          <aside class="recent-reports">
            <div class="card">
              <h3>Minhas Ocorrências</h3>
              <div class="report-list" id="reportList">
                
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </div>
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Detalhes da Ocorrência</h2>
        <button class="btn-close" onclick="fecharModal()">×</button>
      </div>
      <div class="modal-body" id="modalContent">
        
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" onclick="fecharModal()">Fechar</button>
        <button class="btn-edit-modal" id="btnEditModal">Editar Registro</button>
        <button class="btn-delete-modal" id="btnDeleteModal">Excluir</button>
      </div>
    </div>
  </div>

  
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="../../assets/js/login.js"></script>
  <script src="script.js"></script>
  <script>
    document.querySelectorAll('.card').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      });
    });
  </script>
