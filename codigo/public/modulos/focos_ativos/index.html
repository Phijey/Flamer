    <div class="main-area">

      <header class="topbar">
        <h1 class="page-title">Focos Ativos</h1>

        <div class="topbar-controls">
          <div class="topbar-chip topbar-chip--select">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v4M12 19v4M4.22 4.22l2.83 2.83M16.95 16.95l2.83 2.83M1 12h4M19 12h4M4.22 19.78l2.83-2.83M16.95 7.05l2.83-2.83"/></svg>
            Raio:
            <select id="radius-select" class="topbar-select">
              <option value="10" selected>10 km</option>
              <option value="20">20 km</option>
              <option value="40">40 km</option>
            </select>
          </div>
          <div class="topbar-chip topbar-chip--wide" id="focos-farm-name">Carregando…</div>

          <button class="topbar-bell" aria-label="Alertas">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/>
              <path d="M13.73 21a2 2 0 01-3.46 0"/>
            </svg>
            
          </button>

          <div class="topbar-avatar">JP</div>
        </div>
      </header>

      <main class="content-area">

        
        <div class="filter-bar">
          <div class="severity-filters">
            <button class="severity-btn severity-btn--critico" data-filter="critico">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                <path d="M12 2C9 6 6 9 6 13a6 6 0 0012 0c0-4-3-7-6-11z" fill="currentColor"/>
              </svg>
              <span id="count-critico">--</span> Crítico
            </button>
            <button class="severity-btn severity-btn--alto" data-filter="alto">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
              </svg>
              <span id="count-alto">--</span> Alto
            </button>
            <button class="severity-btn severity-btn--medio" data-filter="medio">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="12" y1="8" x2="12" y2="12"/>
                <line x1="12" y1="16" x2="12.01" y2="16"/>
              </svg>
              <span id="count-medio">--</span> Médio
            </button>
          </div>

          <div class="mode-filters">
            <button class="mode-btn" data-mode="propriedade">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M3 9h18M9 21V9"/>
              </svg>
              Minha Propriedade
            </button>
            <button class="mode-btn active" data-mode="todos">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <path d="M2 12h20M12 2a15.3 15.3 0 010 20M12 2a15.3 15.3 0 000 20"/>
              </svg>
              Todos os Focos
            </button>
          </div>

        </div>

        
        <div class="map-layout">

          <div class="map-container">
            <div class="map-canvas">
              <div id="fires-map" style="width:100%;height:100%;min-height:400px;border-radius:8px;"></div>
            </div>

            <div class="map-toolbar">
              <button class="map-action-btn map-action-btn--ghost">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
                </svg>
                Compartilhar mapa
              </button>
              <button class="map-action-btn map-action-btn--ghost">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/>
                  <polyline points="7 10 12 15 17 10"/>
                  <line x1="12" y1="15" x2="12" y2="3"/>
                </svg>
                Exportar KML
              </button>
              <button class="map-action-btn map-action-btn--fire">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none">
                  <path d="M12 2C9 6 6 9 6 13a6 6 0 0012 0c0-4-3-7-6-11z" fill="currentColor"/>
                </svg>
                Reportar novo foco
              </button>
            </div>
          </div>

          
          <div class="focos-panel">
            <div class="focos-search">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
                <circle cx="11" cy="11" r="8"/>
                <line x1="21" y1="21" x2="16.65" y2="16.65"/>
              </svg>
              <input type="text" id="focos-search" placeholder="Buscar foco ou local..." class="focos-search-input"/>
            </div>

            <div class="focos-count" id="focos-count">Carregando…</div>

            <div class="focos-list" id="focos-list">
              <div class="foco-card" style="justify-content:center;align-items:center;color:#999;font-size:13px;">Carregando focos…</div>
            </div>
          </div>

        </div>

      </main>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="../../assets/js/login.js"></script>
  <script src="script.js"></script>
  <script>
    document.querySelectorAll('.focos-panel').forEach(card => {
      card.addEventListener('mousemove', e => {
        const r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (e.clientX - r.left) + 'px');
        card.style.setProperty('--my', (e.clientY - r.top) + 'px');
      });
      card.addEventListener('mouseleave', () => {
        card.style.setProperty('--mx', '50%');
        card.style.setProperty('--my', '50%');
      });
    });
  </script>
